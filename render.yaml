databases:
  - name: evolution-postgres
    databaseName: evolution
    user: evolution
    plan: free
    region: oregon

services:
  # 1. Backend Principal (Next.js App & API Routes)
  - type: web
    name: vision-leads-backend
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GMAPS_SCRAPER_API_URL
        value: https://vision-gmaps-scraper.onrender.com
      - key: EVOLUTION_API_URL
        value: https://vision-evolution-api.onrender.com
      - key: EVOLUTION_API_KEY
        value: vision_evolution_secret_key_2026
      - key: EVOLUTION_INSTANCE_NAME
        value: VisionSolutions

  # 2. Google Maps Scraper Kit (Docker Conteinerizado no Render)
  - type: web
    name: vision-gmaps-scraper
    env: docker
    dockerfilePath: ./docker/scraper/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/v1/jobs
    envVars:
      - key: PORT
        value: 8080

  # 3. Evolution API v2 WhatsApp Baileys (Docker Conteinerizado no Render)
  - type: web
    name: vision-evolution-api
    env: docker
    dockerfilePath: ./docker/evolution/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: SERVER_PORT
        value: 8082
      - key: SERVER_TYPE
        value: http
      - key: AUTHENTICATION_API_KEY
        value: vision_evolution_secret_key_2026
      - key: CONFIG_SESSION_PHONE_CLIENT
        value: Chrome
      - key: CONFIG_SESSION_PHONE_NAME
        value: Chrome
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_URI
        fromDatabase:
          name: evolution-postgres
          property: connectionString
      - key: DATABASE_CONNECTION_CLIENT_NAME
        value: evolution_v2
      - key: DELAY_IGNORE_GROUPS
        value: true
      - key: WEBHOOK_GLOBAL_ENABLED
        value: false
      - key: CACHE_REDIS_ENABLED
        value: false
      - key: QRCODE_LIMIT
        value: 50
