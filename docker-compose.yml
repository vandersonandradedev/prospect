services:
  gmaps-scraper:
    image: gosom/google-maps-scraper:latest
    container_name: gmaps-scraper
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - PORT=8080

  postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_password_2026
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    ports:
      - "8082:8082"
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - SERVER_PORT=8082
      - SERVER_TYPE=http
      - AUTHENTICATION_API_KEY=vision_evolution_secret_key_2026
      - CONFIG_SESSION_PHONE_CLIENT=Chrome
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_password_2026@postgres:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_v2
      - NODE_OPTIONS=--max-old-space-size=380
      - CONFIG_SESSION_PHONE_SYNC_FULL_HISTORY=false
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=false
      - DATABASE_SAVE_DATA_CHATS=false
      - DATABASE_SAVE_DATA_HISTORIC=false
      - DATABASE_SAVE_DATA_LABELS=false
      - DELAY_IGNORE_GROUPS=true
      - DEL_INSTANCE=false
      - WEBHOOK_GLOBAL_ENABLED=false
      - CACHE_REDIS_ENABLED=false
      - QRCODE_LIMIT=50
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store

volumes:
  evolution_instances:
  evolution_store:
  evolution_postgres_data:
